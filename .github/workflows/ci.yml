name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push annule la vérification encore en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: TypeScript et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Build de production
        run: npm run build

      # api/ et scripts/ sont en JavaScript pur : TypeScript ne les vérifie pas.
      - name: Syntaxe des fonctions serverless et des scripts
        run: for f in api/*.js api/og/*.js scripts/*.mjs; do node --check "$f"; done

      # Un vercel.json invalide ferait échouer le déploiement, pas le build.
      - name: Validité de vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
